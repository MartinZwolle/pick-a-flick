name: Container

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - name: Validate Compose configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          PICKAFLICK_VERSION=0.0.0 docker compose -f compose.ghcr.yaml config --quiet
      - name: Build image
        run: docker build --tag pick-a-flick:test .
      - name: Smoke test migrations and HTTP health
        run: |
          docker run -d --name smoke \
            -e PICKAFLICK_CONFIG=/config/config.yaml \
            -e PICKAFLICK_DATA_DIR=/data \
            -v "$PWD/config.example.yaml:/config/config.yaml:ro" \
            pick-a-flick:test
          for attempt in $(seq 1 30); do
            if docker exec smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"; then
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Clean up smoke container
        if: always()
        run: docker rm -f smoke || true

  publish:
    if: github.event_name == 'push' && github.repository == 'MartinZwolle/pick-a-flick'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and main ancestry
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Only stable vMAJOR.MINOR.PATCH tags may be published."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build release image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/MartinZwolle/pick-a-flick" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=GPL-3.0-or-later" \
            --tag "ghcr.io/martinzwolle/pick-a-flick:$VERSION" .
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push versioned image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: docker push "ghcr.io/martinzwolle/pick-a-flick:$VERSION"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
