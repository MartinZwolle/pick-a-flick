{% extends "base.html" %}
{% block title %}Wachtwoord wijzigen — Pick a Flick{% endblock %}
{% block content %}
<h1>Admin-wachtwoord wijzigen</h1>
<p>Gebruik 15 tot en met 128 tekens. Na wijzigen worden alle beheersessies beëindigd.</p>
<form method="post" action="/admin/password">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="old">Huidig wachtwoord</label>
  <input id="old" type="password" name="old_password" autocomplete="current-password"
         maxlength="128" required>
  <label for="new">Nieuw wachtwoord</label>
  <input id="new" type="password" name="new_password" autocomplete="new-password"
         minlength="15" maxlength="128" required>
  <label for="confirmation">Herhaal nieuw wachtwoord</label>
  <input id="confirmation" type="password" name="confirmation" autocomplete="new-password"
         minlength="15" maxlength="128" required>
  <button type="submit">Wachtwoord opslaan en uitloggen</button>
</form>
<p><a href="/admin/settings">Terug naar instellingen</a></p>
{% endblock %}
