[project]
name = "pick-a-flick"
version = "0.10.1"
description = "Self-hosted movie night decision helper"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "argon2-cffi>=23.1,<26",
  "pycountry>=24.6,<27",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0",
  "pyyaml>=6.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
  "prometheus-client>=0.20,<1.0",
  "structlog>=24.4,<26.0",
  "httpx>=0.27,<1.0",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI intentionally uses Depends(), Query() and Form() in parameter defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
